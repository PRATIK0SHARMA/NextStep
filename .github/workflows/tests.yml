name: NextStep checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nextstep_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: nextstep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextstep_test -d nextstep_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock.txt
      - name: SQLite tests
        if: matrix.database == 'sqlite'
        run: python -m pytest -q
      - name: PostgreSQL tests (disposable service database)
        if: matrix.database == 'postgres'
        env:
          NEXTSTEP_TEST_DATABASE_URL: postgresql://nextstep_test:test_only_password@localhost:5432/nextstep_test
        run: python -m pytest -q
      - run: python -m compileall -q app scripts
